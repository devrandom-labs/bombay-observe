[package]
name = "observepass-autoresearch"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# Standalone workspace: the repository root manifest and lockfile are frozen
# production artifacts, so this crate opts out and keeps its own lockfile.
[workspace]

[dependencies]
observepass = { path = "../../crates/observepass" }

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[dev-dependencies]
proptest = "1.11"
