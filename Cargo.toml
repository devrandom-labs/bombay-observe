[workspace]
resolver = "2"
members = ["crates/observe", "crates/observe-perf", "crates/observe-tests"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/bombay-observe"
homepage = "https://devrandom-labs.github.io/bombay-observe/"

[workspace.dependencies]
observe = { package = "bombay-observe", path = "crates/observe" }
observe-tests = { package = "bombay-observe-tests", path = "crates/observe-tests" }
criterion = "0.8"
loom = "0.7"
parking_lot = "0.12"
proptest = "1.11"
thiserror = "2"
triomphe = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.metadata.crane]
name = "bombay-observe"
